backend:
  name: github
  repo: KreedAc/lecandlex
  branch: main
  # Worker OAuth su Cloudflare: vedi README, sezione "Attivare il CMS".
  base_url: https://CAMBIAMI.workers.dev

locale: it
publish_mode: simple
site_url: https://lecandlex.pages.dev

# Le foto vengono salvate in src/assets/ e non in public/, cosi' Astro le
# ottimizza in AVIF/WebP. public_folder e' un percorso relativo al file .md
# perche' e' cosi' che Astro risolve le immagini nelle content collections.
media_folder: src/assets/prodotti
public_folder: ../../assets/prodotti

collections:
  - name: prodotti
    label: Prodotti
    label_singular: Prodotto
    folder: src/content/prodotti
    create: true
    slug: '{{slug}}'
    identifier_field: nome
    summary: '{{nome}}'
    sortable_fields: [ordine, nome, prezzo]
    fields:
      - { name: nome, label: Nome, widget: string }

      - name: collezione
        label: Collezione
        widget: relation
        collection: collezioni
        search_fields: [nome]
        value_field: '{{slug}}'
        display_fields: [nome]

      - name: prezzo
        label: Prezzo in euro
        widget: number
        value_type: float
        min: 0
        required: false
        hint: Solo il numero, senza €. Lascialo vuoto se il prodotto ha più formati.

      - name: varianti
        label: Formati (se ce n'è più di uno)
        widget: list
        required: false
        label_singular: Formato
        hint: Usa questo solo per articoli che esistono in più taglie, tipo L e S.
        fields:
          - { name: nome, label: Nome del formato, widget: string, hint: 'Esempio - Grande, Piccolo, Max' }
          - { name: prezzo, label: Prezzo in euro, widget: number, value_type: float, min: 0 }
          - { name: pesoGrammi, label: Peso in grammi, widget: number, value_type: int, required: false }
          - { name: dimensioni, label: Dimensioni, widget: string, required: false }

      - name: copertina
        label: Foto principale
        widget: image
        hint: È la foto che si vede nel catalogo.

      - name: altCopertina
        label: Descrizione della foto
        widget: string
        hint: Serve a chi non vede le immagini e a Google. Esempio - "Candela a forma di gufo, color panna, su un tronchetto di legno".

      - name: galleria
        label: Altre foto
        widget: list
        required: false
        label_singular: Foto
        fields:
          - { name: file, label: Foto, widget: image }
          - { name: alt, label: Descrizione della foto, widget: string }

      - name: materiale
        label: Materiale
        widget: select
        default: cera
        options:
          - { label: Cera, value: cera }
          - { label: Ceramica, value: ceramica }
          - { label: Jesmonite, value: jesmonite }
          - { label: Resina, value: resina }
          - { label: Vetro, value: vetro }
          - { label: Materiali misti, value: misto }

      - { name: pesoGrammi, label: Peso in grammi, widget: number, value_type: int, required: false }

      - name: dimensioni
        label: Dimensioni
        widget: string
        required: false
        hint: Base x altezza, come nel catalogo. Esempio - 6x8 cm

      - name: stampoEsclusivo
        label: Stampo esclusivo
        widget: boolean
        default: false
        hint: Accendilo se lo stampo l'hai creato tu. Compare come badge sul prodotto.

      - name: personalizzabile
        label: Personalizzabile nei colori
        widget: boolean
        default: false

      - name: profumabile
        label: Si può profumare
        widget: boolean
        default: true

      - name: disponibile
        label: Disponibile
        widget: boolean
        default: true
        hint: Se lo spegni, la scheda resta online e mostra "In preparazione".

      - { name: inEvidenza, label: Mostra in home, widget: boolean, default: false }

      - name: ordine
        label: Ordine
        widget: number
        value_type: int
        default: 100
        hint: Numero più basso = compare prima.

      - name: nota
        label: Nota
        widget: string
        required: false
        hint: Vincoli o supplementi. Esempio - "disponibile solo in ceramica", "piedistallo +1€".

      - name: estratto
        label: Frase breve
        widget: string
        required: false
        hint: Una riga sola, massimo 180 caratteri.
        pattern: ['^.{0,180}$', 'Massimo 180 caratteri']

      - { name: paginaCatalogo, label: Pagina del catalogo Canva, widget: number, value_type: int, required: false }

      - name: body
        label: Descrizione
        widget: markdown
        required: false

  - name: collezioni
    label: Collezioni
    label_singular: Collezione
    folder: src/content/collezioni
    create: true
    slug: '{{slug}}'
    identifier_field: nome
    fields:
      - { name: nome, label: Nome, widget: string }
      - { name: descrizione, label: Descrizione, widget: text }
      - { name: copertina, label: Foto di copertina, widget: image, required: false }
      - { name: altCopertina, label: Descrizione della foto, widget: string, required: false }
      - { name: ordine, label: Ordine, widget: number, value_type: int, default: 100 }

  - name: impostazioni
    label: Impostazioni del sito
    files:
      - name: sito
        label: Dati generali e contatti
        file: src/data/sito.json
        fields:
          - { name: nome, label: Nome del marchio, widget: string }
          - { name: sottotitolo, label: Sottotitolo, widget: string }
          - { name: claim, label: Frase di presentazione, widget: string }
          - { name: descrizione, label: Descrizione per Google, widget: text }
          - { name: titolare, label: Nome e cognome, widget: string }
          - { name: email, label: Email, widget: string }
          - name: whatsapp
            label: Numero WhatsApp
            widget: string
            hint: Formato internazionale senza + e senza spazi. Esempio - 393459190403
            pattern: ['^[0-9]{8,15}$', 'Solo cifre, senza + e senza spazi']
          - { name: telefonoLeggibile, label: Telefono come si legge, widget: string }
          - { name: instagram, label: Nome utente Instagram, widget: string, hint: Senza la chiocciola. }
          - { name: facebook, label: Pagina Facebook, widget: string }
          - { name: citta, label: Città o zona, widget: string }
          - { name: omaggioDa, label: Omaggio a partire da (euro), widget: number, value_type: int }
          - { name: preavvisoBomboniereMesi, label: Preavviso bomboniere (mesi), widget: number, value_type: int }
          - { name: stagionaturaGiorni, label: Giorni di stagionatura, widget: number, value_type: int }
          - name: spedizione
            label: Spedizioni
            widget: object
            fields:
              - { name: costo, label: Costo, widget: string }
              - { name: gratisDa, label: Gratis a partire da, widget: string }
              - { name: tempi, label: Tempi di consegna, widget: string }
              - { name: ritiroInPersona, label: Ritiro di persona possibile, widget: boolean, default: true }

      - name: fragranze
        label: Elenco fragranze
        file: src/data/fragranze.json
        fields:
          - name: fragranze
            label: Fragranze
            widget: list
            field: { name: nome, label: Fragranza, widget: string }
